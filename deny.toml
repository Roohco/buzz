[advisories]
ignore = [
    # SQLite's crafted database/WAL disclosure requires opening a database file
    # supplied by an attacker. In this workspace the only SQLite user is
    # buzz-broker-host's own state store (sqlx `sqlite` feature, store.rs): it
    # opens a single pre-existing state file that must be owned by the current
    # user with mode 0600 (validate_state_path), never an imported or
    # attacker-supplied db/-wal. Every released sqlx-sqlite (0.9.0) caps
    # libsqlite3-sys below 0.38, so the patched 0.39 is not selectable without
    # pinning sqlx to an unreleased git revision, which we do not do. Remove
    # when a released sqlx allows libsqlite3-sys >= 0.39; the ban below fences
    # the old SQLite to sqlx-sqlite.
    { id = "RUSTSEC-2026-0459", reason = "SQLite only in buzz-broker-host's own 0600 state file; no attacker-supplied db/WAL is opened; no released sqlx allows libsqlite3-sys >= 0.39" },
    # rmcp 1.8 is used only by buzz-agent, with default-features=false and
    # client + transport-child-process. Neither affected Streamable HTTP client
    # transport is compiled (bans.features below). buzz-dev-mcp uses the
    # patched rmcp 3.9.0. Remove on buzz-agent's rmcp 3 migration; the ban
    # below fences consumers.
    { id = "RUSTSEC-2026-0462", reason = "rmcp 1.8 only in buzz-agent's subprocess client; vulnerable Streamable HTTP transport features disabled; rmcp 3 consumers on 3.9.0" },
    # instant 0.1.13 — unmaintained crate. Transitive dep: nostr → instant.
    # Will be resolved when nostr crate updates its dependencies.
    { id = "RUSTSEC-2024-0384", reason = "transitive dep via nostr; no upstream fix available" },
    # paste 1.0.15 — unmaintained. Transitive dep: mesh-llm → iroh → netlink-* → paste.
    # No safe upgrade available; tracked for upstream (iroh/netlink) replacement.
    { id = "RUSTSEC-2024-0436", reason = "transitive dep via mesh-llm → iroh → netlink; no upstream fix available" },
    # quick-xml < 0.41: quadratic runtime on duplicate-attribute check (0194) and
    # unbounded namespace-declaration allocation in NsReader (0195). Both DoS-class,
    # requiring attacker-controlled XML. Our two locked versions only parse trusted
    # input: 0.38.4 (rust-s3/aws-creds — responses from our own S3/MinIO endpoint)
    # and 0.39.4 (mesh-llm → iroh → netdev → plist — local macOS system plists).
    # Patched release (>= 0.41.0) is unreachable until rust-s3 and plist/netdev bump;
    # remove these when upstream catches up.
    { id = "RUSTSEC-2026-0194", reason = "transitive via rust-s3 and mesh-llm→plist; trusted-input XML only; no upstream fix available yet" },
    { id = "RUSTSEC-2026-0195", reason = "transitive via rust-s3 and mesh-llm→plist; trusted-input XML only; no upstream fix available yet" },
    # chrono — unmaintained, not vulnerable (RUSTSEC-2026-0543). Direct workspace
    # dependency of most crates; no maintained release. Removal needs a
    # time/jiff migration. Same entry as upstream block/buzz 66b463fb2.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, not vulnerable; direct workspace dependency; removal needs a time/jiff migration" },
    # unsafe-libyaml 0.2.11 — unmaintained (repository archived 2024-03-25), not a
    # vulnerability report. Transitive dep: serde_yaml → unsafe-libyaml (buzz-agent,
    # buzz-persona, buzz-relay, buzz-workflow, kube-client). The serde_yaml_ng fork
    # uses the same crate, so removing it means migrating YAML parsing; out of scope.
    { id = "RUSTSEC-2024-0449", reason = "transitive via serde_yaml; unmaintained, not vulnerable; removal needs a YAML parser migration" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MITNFA",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    # minicbor's permissive, OSI-approved license. Used for strict App Attest
    # assertion CBOR parsing and also transitively by appattest.
    "BlueOak-1.0.0",
    # bzip2/libbzip2's permissive BSD-like license. New via desktop zip/bzip2
    # transitive deps; compatible with Apache-2.0 distribution.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

# mesh-llm workspace crates (pinned git dep) omit a per-crate `license` field in
# their manifests, so cargo-deny reports them as unlicensed. The mesh-llm repo is
# licensed "MIT OR Apache-2.0" (workspace Cargo.toml + top-level LICENSE = Apache-2.0);
# clarify each pulled-in member to that expression. Remove once mesh sets the field
# upstream (filed).
[[licenses.clarify]]
crate = "mesh-llm-config"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-gpu-bench"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-host-runtime"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-plugin"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-system"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-mixture-of-agents"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "buzz-desktop"
expression = "Apache-2.0"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { name = "rmcp", version = "<3.9.0", wrappers = ["buzz-agent"], reason = "only buzz-agent's subprocess-only rmcp 1 client may use an older version; HTTP consumers must use patched rmcp" },
    { name = "libsqlite3-sys", version = "<0.39", wrappers = ["sqlx-sqlite"], reason = "older SQLite is limited to sqlx-sqlite (buzz-broker-host's own state store)" },
]

